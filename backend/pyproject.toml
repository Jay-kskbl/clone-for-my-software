[project]
name = "docmgr-backend"
version = "0.1.0"
description = "基于多模态信息检索的智能文档管理系统 —— 后端（main 环境）"
requires-python = ">=3.11"
# 只放 main 环境的依赖；PaddleOCR / PyTorch 分别属于 ocr、clip 环境，不得写在这里（GLOBAL §3.4）。
dependencies = [
    "fastapi==0.162.5",          # HTTP 接口
    "uvicorn[standard]==0.54.0", # ASGI 服务器
    "pydantic==2.14.3",          # 数据结构校验
    "pydantic-settings==2.16.2", # 从环境变量读取配置
    "psycopg[binary]==3.3.9",    # PostgreSQL 驱动
    "httpx==0.28.1",             # 调用 OpenSearch / CLIP 服务（带超时）
    "sqlalchemy==2.1.8",         # ORM 与表结构定义
    "alembic==1.20.1",           # 数据库迁移
    "pyjwt==2.15.1",             # 签发和校验登录令牌（JWT）
    "argon2-cffi==25.1.0",       # 密码哈希（Argon2id）
    "python-multipart==0.0.33",  # 解析 multipart/form-data 上传（FastAPI 的 UploadFile 需要）
    # PDF 解析（M5）。锁在 1.x：2.x 会强制带入 onnxruntime、numpy 等本项目用不到的包
    "pymupdf==1.28.2",
    "python-docx==1.2.0",        # Word 解析（M5）
    "openpyxl==3.1.5",           # Excel 解析（M5）
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# 两个索引的 mapping 是随代码一起发布的数据文件；不声明的话，非 editable 安装时不会被带上
"app.modules.text_index" = ["mappings/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
