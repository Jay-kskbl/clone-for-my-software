# 开发用依赖服务：PostgreSQL + OpenSearch。
# 启动（在项目根目录执行）：
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
name: docmgr

services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 中设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 中设置 POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    # 附录 A13：中文分词用官方插件 analysis-smartcn（Barry 于 2026-11-14 选定，未经本机实测）。
    # 镜像在官方 2.19.1 的基础上安装该插件，见 deploy/opensearch/Dockerfile；
    # 第一次启动前会自动构建，需要联网下载插件。
    build:
      context: ./opensearch
    image: docmgr-opensearch:2.19.1-smartcn
    environment:
      discovery.type: single-node
      # 禁止“往不存在的索引里写数据时自动建索引”：自动建出来的索引没有中文分词、
      # 字段类型靠猜。两个索引只能由后端按版本库里的 mapping 创建（text_index.ensure_indices）
      action.auto_create_index: "false"
      # 仅限本机开发：关闭安全插件，端口只绑定 127.0.0.1
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  osdata:
