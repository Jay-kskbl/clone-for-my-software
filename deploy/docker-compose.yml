# 开发用依赖服务：PostgreSQL + OpenSearch。
# 启动（在项目根目录执行）：
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
name: docmgr

services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 中设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 中设置 POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    # 待定（附录 A13）：中文分词插件（analysis-smartcn 或 IK）要等 T00 环境实测后确定。
    # 目前使用不带中文分词插件的官方镜像；确定后改为在此镜像基础上安装插件的自定义镜像，
    # 插件版本必须与这里的 OpenSearch 版本严格一致。
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      # 仅限本机开发：关闭安全插件，端口只绑定 127.0.0.1
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  osdata:
