    --ok: #72d09b; --ok-soft: #163124; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #19202a; --ink: #e5e9f0; --muted: #9aa4b6; --line: #3a4453; --rail: #1e2531;
  --accent: #84a8ff; --accent-soft: #1d2a46; --warn: #e3a64c; --warn-soft: #382a12; --bad: #f2897e; --bad-soft: #3b1c19;
  --ok: #72d09b; --ok-soft: #163124; color-scheme: dark;

}

.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; color: var(--muted); }

.lead { color: var(--muted); }

nav.toc { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; }
nav.toc a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
nav.toc a:hover, nav.toc a:focus-visible { border-bottom-color: var(--accent); }

section.fig-sec { display: grid; gap: 14px; scroll-margin-top: 24px; }

.fig-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }

figcaption { font-size: 14px; color: var(--muted); max-width: 46rem; }

/* diagram marks */
.d text { font-family: var(--sans); }
.d .box { fill: var(--surface); stroke: var(--ink); stroke-width: 1.3; }

.d .l { fill: var(--muted); font-size: 11.5px; }

.d .bad { fill: var(--bad); font-size: 12px; }

/* review */
.review { display: grid; gap: 22px; }
.items { display: grid; gap: 0; border-top: 1px solid var(--line); }
.item { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 6px 20px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.item h3 { margin: 0 0 4px; }
.item p + p { margin-top: 6px; }
.item .k { color: var(--muted); font-weight: 600; margin-right: 4px; }
.chip { display: inline-block; justify-self: start; align-self: start; font-size: 12px; line-height: 1.6; padding: 2px 9px; border-radius: 999px; font-weight: 600; white-space: nowrap; letter-spacing: 0.02em; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chip.muted { background: var(--rail); color: var(--muted); }

.known { display: grid; gap: 8px; }
.known ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }

.num { font-variant-numeric: tabular-nums; }

@media (max-width: 560px) {
  h1 { font-size: 25px; }
  .item { grid-template-columns: minmax(0, 1fr); }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

<body>
<div class="wrap">
  <header class="prose">
    <div class="eyebrow">feat/search-motion · 5df781b · 2026-11-26</div>
    <h1>后端总体流程结构图</h1>
    <p class="lead">四张图依次是：进程与存储、一份文件经过的任务、一次检索、任务状态机。图中的默认参数（超时、租约、重试间隔、RRF 的 k）取自 <code>backend/app/config.py</code>，延迟取自 W3（500 个文件）的实验记录。</p>
    <nav class="toc" aria-label="目录">
      <a href="#fig-1">图 1 进程与存储</a>
      <a href="#fig-2">图 2 文件的任务链</a>
      <a href="#fig-3">图 3 一次检索</a>
      <a href="#fig-4">图 4 任务状态机</a>
    </nav>
  </header>

  <!-- ===================== 图 1 ===================== -->
  <section class="fig-sec" id="fig-1">
    <h2 class="prose">图 1　进程与存储</h2>
    <figure>
      <div class="fig-scroll">
        <svg class="d" viewBox="0 0 1040 362" role="img" aria-label="四个进程和三处存储：API 服务与两个 Worker 通过 PostgreSQL 任务表交接，CLIP 服务不连数据库。">
          <defs>
            <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
          </defs>

          <!-- storage rails -->
          <rect class="rail" x="20" y="128" width="1000" height="60" rx="6"/>
          <rect class="rail" x="20" y="208" width="1000" height="60" rx="6"/>
          <rect class="rail" x="20" y="288" width="1000" height="60" rx="6"/>
          <text class="tt" x="36" y="154">PostgreSQL</text>
          <text class="s acc" x="36" y="173">任务表：API 写入，Worker 领取</text>
          <text class="tt" x="36" y="234">文件存储</text>
          <text class="s" x="36" y="253">STORAGE_ROOT</text>
          <text class="tt" x="36" y="314">OpenSearch</text>
          <text class="s" x="36" y="333">3 个索引</text>

          <!-- drops: each process reaches every store it uses -->
          <line class="drop" x1="310" y1="88" x2="310" y2="318"/>
          <line class="drop" x1="760" y1="88" x2="760" y2="318"/>
          <line class="drop" x1="950" y1="88" x2="950" y2="318"/>

          <!-- processes -->
          <rect class="box" x="20" y="20" width="140" height="68" rx="6"/>
          <text class="tt" x="90" y="49" text-anchor="middle">前端</text>
          <text class="s" x="90" y="69" text-anchor="middle">Vue 3 · 浏览器</text>

          <rect class="box" x="220" y="20" width="180" height="68" rx="6"/>
          <text class="tt" x="310" y="49" text-anchor="middle">API 服务</text>
          <text class="s" x="310" y="69" text-anchor="middle">FastAPI · main 环境</text>

          <rect class="box" x="470" y="20" width="130" height="68" rx="6"/>
          <text class="tt" x="535" y="49" text-anchor="middle">CLIP 服务</text>
          <text class="s" x="535" y="69" text-anchor="middle">clip 环境 · :8001</text>
          <text class="s" x="535" y="108" text-anchor="middle">无状态，不连数据库</text>

          <rect class="box" x="670" y="20" width="180" height="68" rx="6"/>
          <text class="tt" x="760" y="49" text-anchor="middle">通用 Worker</text>
          <text class="s" x="760" y="69" text-anchor="middle">main 环境 · 每任务一个子进程</text>

          <rect class="box" x="880" y="20" width="140" height="68" rx="6"/>
          <text class="tt" x="950" y="49" text-anchor="middle">OCR Worker</text>
          <text class="s" x="950" y="69" text-anchor="middle">ocr 环境 · PaddleOCR</text>

          <!-- calls between processes -->
          <line class="edge" x1="160" y1="54" x2="217" y2="54" marker-end="url(#a1)"/>
          <text class="l" x="189" y="46" text-anchor="middle">REST</text>
          <text class="l" x="189" y="73" text-anchor="middle">JWT</text>

          <line class="edge" x1="400" y1="54" x2="467" y2="54" marker-end="url(#a1)"/>
          <text class="l" x="435" y="46" text-anchor="middle">编码查询</text>
          <text class="l" x="435" y="73" text-anchor="middle">3 s 超时</text>

          <line class="edge" x1="670" y1="54" x2="603" y2="54" marker-end="url(#a1)"/>
          <text class="l" x="636" y="46" text-anchor="middle">编码图片</text>
          <text class="l" x="636" y="73" text-anchor="middle">60 s 超时</text>

          <!-- what each process does in each store -->
          <rect class="pill" x="246" y="136" width="128" height="44" rx="6"/>
          <text class="s" x="310" y="154" text-anchor="middle">文档 · 标签 · 共享</text>
          <text class="s" x="310" y="171" text-anchor="middle">建任务 · 写检索日志</text>
          <rect class="pill" x="230" y="216" width="160" height="44" rx="6"/>
          <text class="s" x="310" y="234" text-anchor="middle">上传：临时文件→正式路径</text>
          <text class="s" x="310" y="251" text-anchor="middle">下载：流式读出</text>
          <rect class="pill" x="238" y="296" width="144" height="44" rx="6"/>
          <text class="s" x="310" y="314" text-anchor="middle">查 doc_meta · chunks</text>
          <text class="s" x="310" y="331" text-anchor="middle">查 image_vectors</text>

          <rect class="pill" x="685" y="136" width="150" height="44" rx="6"/>
          <text class="s" x="760" y="154" text-anchor="middle">领取、续租、回写任务</text>
          <text class="s" x="760" y="171" text-anchor="middle">写片段 · 文档状态 · 向量</text>
          <rect class="pill" x="684" y="216" width="152" height="44" rx="6"/>
          <text class="s" x="760" y="234" text-anchor="middle">parse / embed 读原文件</text>
          <text class="s" x="760" y="251" text-anchor="middle">cleanup 删文件</text>
          <rect class="pill" x="680" y="296" width="160" height="44" rx="6"/>
          <text class="s" x="760" y="314" text-anchor="middle">写 doc_meta · chunks</text>
          <text class="s" x="760" y="331" text-anchor="middle">写 image_vectors · 删除</text>

          <rect class="pill" x="895" y="136" width="110" height="44" rx="6"/>
          <text class="s" x="950" y="154" text-anchor="middle">领取 ocr 任务</text>
          <text class="s" x="950" y="171" text-anchor="middle">写 ocr_results</text>
          <rect class="pill" x="902" y="216" width="96" height="44" rx="6"/>
          <text class="s" x="950" y="234" text-anchor="middle">只读原文件</text>
          <text class="s" x="950" y="251" text-anchor="middle">按页渲染</text>
          <rect class="pill" x="890" y="296" width="120" height="44" rx="6"/>
          <text class="s" x="950" y="314" text-anchor="middle">写 chunks</text>
          <text class="s mono" x="950" y="331" text-anchor="middle">source_type=ocr</text>
        </svg>
      </div>
      <figcaption>四个进程，三处存储。API 和两个 Worker 之间没有直接调用，只通过 PostgreSQL 的任务表交接；CLIP 服务不连数据库，只把查询文本和图片编码成向量。竖线穿过的每一层，写的是这个进程在那里读写什么。</figcaption>
    </figure>
  </section>

  <!-- ===================== 图 2 ===================== -->
  <section class="fig-sec" id="fig-2">
    <h2 class="prose">图 2　一份文件经过的任务</h2>
    <figure>
      <div class="fig-scroll">
        <svg class="d" viewBox="0 0 1040 386" role="img" aria-label="上传创建 parse 任务，parse 再为扫描页创建 ocr 任务、为图片创建 embed 任务；删除创建 cleanup 任务，按索引、文件、数据库记录的顺序删除。">
          <defs>
            <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
          </defs>

          <!-- upload -->
          <rect class="box" x="20" y="30" width="230" height="160" rx="6"/>
          <text class="tt" x="36" y="56">上传 · API 请求内</text>
          <text class="t" x="36" y="82">1 写临时文件，算 sha256</text>
          <text class="t" x="36" y="101">2 按文件魔数识别真实类型</text>
          <text class="t" x="36" y="120">3 建 Document 与 parse 任务</text>
          <text class="t" x="36" y="139">4 移到正式路径</text>
          <text class="t" x="36" y="158">5 提交数据库</text>
          <text class="s" x="36" y="178">任一步失败：回滚并删掉文件</text>

          <line class="edge" x1="250" y1="110" x2="297" y2="110" marker-end="url(#a2)"/>
          <text class="l" x="274" y="102" text-anchor="middle">提交</text>

          <!-- parse -->
          <rect class="box" x="300" y="30" width="250" height="160" rx="6"/>
          <text class="tt" x="316" y="56">parse 任务 · 通用 Worker</text>
          <text class="t" x="316" y="82">1 写 doc_meta</text>
          <text class="t" x="316" y="101">2 解析、切分（纯计算）</text>
          <text class="t" x="316" y="120">3 替换 body 片段，写 chunks</text>
          <text class="t" x="316" y="139">4 复查文档未被删除</text>
          <text class="t" x="316" y="158">5 置 succeeded，建后续任务</text>
          <text class="s" x="316" y="178">失败按 30 s / 120 s 重试</text>
          <text class="s acc" x="316" y="212">第 1 步后能按文件名搜到，第 3 步后能按正文搜到</text>

          <line class="edge" x1="550" y1="62" x2="637" y2="62" marker-end="url(#a2)"/>
          <text class="l" x="594" y="54" text-anchor="middle">扫描页、图片</text>
          <line class="edge" x1="550" y1="160" x2="637" y2="160" marker-end="url(#a2)"/>
          <text class="l" x="594" y="152" text-anchor="middle">仅图片</text>

          <!-- ocr -->
          <rect class="box" x="640" y="20" width="260" height="84" rx="6"/>
          <text class="tt" x="656" y="46">ocr 任务 · OCR Worker · 每页一个</text>
          <text class="t" x="656" y="70">渲染 → PaddleOCR 识别 → 切分</text>
          <text class="t" x="656" y="89">写 ocr_results 与 chunks</text>
          <text class="s acc" x="914" y="57">→ text 通道</text>
          <text class="s acc" x="914" y="74">OCR 文字</text>

          <!-- embed -->
          <rect class="box" x="640" y="118" width="260" height="84" rx="6"/>
          <text class="tt" x="656" y="144">embed 任务 · 通用 Worker</text>
          <text class="t" x="656" y="168">按 sha256 去重，调 CLIP 编码</text>
          <text class="t" x="656" y="187">写 image_embeddings 与向量索引</text>
          <text class="s acc" x="914" y="164">→ image 通道</text>

          <!-- delete -->
          <rect class="box" x="20" y="250" width="230" height="120" rx="6"/>
          <text class="tt" x="36" y="276">删除 · API 请求内</text>
          <text class="t" x="36" y="302">1 写 deleted_at</text>
          <text class="t" x="36" y="321">2 建 cleanup 任务</text>
          <text class="t" x="36" y="340">3 两步同一事务提交</text>
          <text class="s acc" x="36" y="359">提交后所有查询立即看不到它</text>

          <line class="edge" x1="250" y1="310" x2="297" y2="310" marker-end="url(#a2)"/>
          <text class="l" x="274" y="302" text-anchor="middle">提交</text>

          <!-- cleanup -->
          <rect class="box" x="300" y="250" width="250" height="120" rx="6"/>
          <text class="tt" x="316" y="276">cleanup 任务 · 通用 Worker</text>
          <text class="t" x="316" y="302">1 删 chunks、doc_meta</text>
          <text class="t" x="316" y="321">2 删 image_vectors</text>
          <text class="t" x="316" y="340">3 删原文件</text>
          <text class="t" x="316" y="359">4 硬删除文档，级联删除任务本身</text>

          <!-- note -->
          <rect class="note" x="640" y="250" width="380" height="120" rx="6"/>
          <text class="tt" x="656" y="276">删除为什么可以异步</text>
          <text class="s" x="656" y="300">软删除一提交，检索返回前的数据库二次校验</text>
          <text class="s" x="656" y="318">（图 3 第 4 步）就会把它过滤掉。cleanup 没跑完时，</text>
          <text class="s" x="656" y="336">索引里的残留也不会出现在结果里。数据库记录最后</text>
          <text class="s" x="656" y="354">才删，所以 cleanup 中途失败可以重试。</text>
        </svg>
      </div>
      <figcaption>每个箭头都经过 <code>processing_tasks</code> 表交接：前一步提交之后，后一步的任务才能被领取，所以 Worker 看到 parse 任务时，文件一定已经在正式路径上。蓝字是这一步完成后，文件能被哪个检索通道搜到。</figcaption>
    </figure>
  </section>

  <!-- ===================== 图 3 ===================== -->
  <section class="fig-sec" id="fig-3">
    <h2 class="prose">图 3　一次检索</h2>
    <figure>
      <div class="fig-scroll">
        <svg class="d" viewBox="0 0 1040 326" role="img" aria-label="检索时 meta 和 text 通道在主线程依次执行，图像通道在工作线程同时执行；三路结果经 RRF 融合，再经数据库二次校验后返回。">
          <defs>
            <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
          </defs>

          <rect class="box" x="20" y="110" width="175" height="110" rx="6"/>
          <text class="tt mono" x="36" y="136">POST /api/search</text>
          <text class="t" x="36" y="162">1 校验请求，定通道</text>
          <text class="t" x="36" y="181">查可访问 ID</text>
          <text class="s" x="36" y="200">管理员不查、不过滤</text>
